# Copy to secret.yaml, fill in real values, then apply. NEVER commit real secrets.
#
# Generate a strong JWT secret:
#   openssl rand -base64 48
#
# Generate the users list (email:bcrypt-hash pairs, comma separated):
#   https://docs.enclosed.cc/self-hosting/users-authentication-key-generator
#   or: htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n'
apiVersion: v1
kind: Secret
metadata:
  name: enclosed-secrets
  namespace: enclosed
  labels:
    app.kubernetes.io/name: enclosed
type: Opaque
stringData:
  AUTHENTICATION_JWT_SECRET: "REPLACE_ME__openssl_rand_base64_48"
  # Only needed when PUBLIC_IS_AUTHENTICATION_REQUIRED is "true":
  AUTHENTICATION_USERS: ""

# Alternative: mount this secret as a volume and point the server at the files
# instead of passing the values through the environment — the server supports
# AUTHENTICATION_JWT_SECRET_FILE and AUTHENTICATION_USERS_FILE, e.g.:
#   env:
#     - name: AUTHENTICATION_JWT_SECRET_FILE
#       value: /secrets/AUTHENTICATION_JWT_SECRET
#   volumeMounts:
#     - name: secrets
#       mountPath: /secrets
#       readOnly: true
#   volumes:
#     - name: secrets
#       secret:
#         secretName: enclosed-secrets
